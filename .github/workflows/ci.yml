name: CI

on: [push, pull_request , workflow_dispatch]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Compile-time verification only. A hosted runner can build this crate but can
  # never run it: the device requires VK_EXT_descriptor_heap and
  # VK_KHR_shader_untyped_pointers (see src/vulkan_abstraction/core/mod.rs), which
  # neither lavapipe nor SwiftShader implement. Execution happens in `gpu` below.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Needs no build, so formatting breakage reports in seconds rather than
      # after the whole native-dep dance below.
      - run: cargo fmt --all --check

      # libclang: bindgen, for shader-slang-sys.
      # X11/wayland: winit, so --all-targets can build the `window` example.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libwayland-dev libxkbcommon-dev \
            libxcursor-dev libxrandr-dev libxi-dev

      # Pinned, never `latest`: build.rs hard-panics if the bundled Slang predates
      # PR #10177 (Feb 2026) and so doesn't know `spvDescriptorHeapEXT`.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.357.0
          destination: ${{ github.workspace }}/vulkan-sdk
          cache: true

      # Probed rather than hardcoded: the Linux SDK nests everything under
      # <dest>/<version>/x86_64/ and puts Slang's headers in their own
      # subdirectory, and that layout has moved between SDK releases. Finding the
      # files is version-proof; a hardcoded path is how the first run failed
      # (shader-slang-sys panicked with NotExist on slang.h).
      # Set via $GITHUB_ENV, not a job-level `env:` block, so there is no
      # precedence ambiguity between the two.
      - name: Locate the SDK's Slang
        run: |
          set -euo pipefail
          inc=$(find "${{ github.workspace }}/vulkan-sdk" -name slang.h -print -quit)
          lib=$(find "${{ github.workspace }}/vulkan-sdk" -name 'libslang.so*' -print -quit)
          test -n "$inc" || { echo "::error::slang.h not found in the SDK"; exit 1; }
          test -n "$lib" || { echo "::error::libslang.so not found in the SDK"; exit 1; }
          echo "SLANG_INCLUDE_DIR=$(dirname "$inc")" >> "$GITHUB_ENV"
          echo "SLANG_LIB_DIR=$(dirname "$lib")" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$lib")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "found slang.h at $inc"
          echo "found libslang at $lib"

      - uses: Swatinem/rust-cache@v2

      # Both rustc and clippy lints are at zero; keep them there.
      # Flags after `--` apply to this crate only, not to dependencies.
      - run: cargo clippy --all-targets -- -D warnings

      # 9 device-free tests; the two Core::new ones are #[ignore]d and run in `gpu`.
      - run: cargo test

  # Everything that actually executes the renderer, on hardware we own.
  #
  # Gated on the GPU_RUNNER repository variable, which does not exist yet:
  # `vars.GPU_RUNNER` is then the empty string and the job is *skipped*. Without
  # this gate the job queues forever waiting for a runner that isn't registered,
  # which leaves every run permanently "in progress" and blocks log downloads.
  # To switch it on once a self-hosted runner exists: Settings → Secrets and
  # variables → Actions → Variables → new repository variable GPU_RUNNER = true.
  # No workflow edit needed. Until then, run scripts/gpu-check.ps1 by hand.
  gpu:
    # A self-hosted runner reachable from a fork PR is remote code execution on a
    # personal machine. Same-repo events only.
    if: >-
      vars.GPU_RUNNER == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, windows, gpu]
    defaults:
      run:
        shell: pwsh
    # Set explicitly rather than inherited from .cargo/config.toml's [env]: the
    # smoke tests below launch the built .exe directly, which cargo never sees.
    # Without validation on, the release window example hits the known async-UAF
    # driver crash documented at src/lib.rs:1168.
    env:
      SUNRAY_ENABLE_VALIDATION_LAYER: "1"
      SUNRAY_SERIALIZE_FRAMES: "1"
    steps:
      - uses: actions/checkout@v7

      # --include-ignored picks up transient_aliasing_debug and
      # compile_runs_passes_in_topo_order. Release so every step below reuses it.
      - name: Test (incl. GPU)
        run: cargo test --release -- --include-ignored

      # `cargo png` is the release alias from .cargo/config.toml.
      - name: Render offscreen
        run: cargo png

      - name: Compare against baseline
        run: |
          $want = (Get-Content examples/png/render.sha256).Trim()
          $got  = (Get-FileHash examples/png/render.png -Algorithm SHA256).Hash
          if ($got -ne $want) {
            throw "render changed: want=$want got=$got (re-baseline if intended)"
          }
          "pixel-identical ($got)"

      # Two conditions, because surviving is not the same as working: it must not
      # exit inside 10s (a healthy window never exits on its own, so an early exit
      # is a panic or the graceful path — handle_srresult exits the event loop on
      # any non-OUT_OF_DATE error), AND it must print the once-a-second
      # "[heartbeat]" line. A deadlocked renderer never exits either, so the
      # liveness half alone reports a hung binary as green.
      # -WorkingDirectory matters — the example resolves examples/log4rs.yaml and
      # the .glb against CWD.
      # Needs a logged-in interactive runner session: this opens a real window.
      - name: Smoke-test window example (10s)
        run: |
          cargo build --release --example window
          $out = New-TemporaryFile
          $p = Start-Process -FilePath "target\release\examples\window.exe" -WorkingDirectory $PWD -PassThru -RedirectStandardOutput $out
          if ($p.WaitForExit(10000)) { throw "window exited early (code $($p.ExitCode))" }
          $p.Kill(); $p.WaitForExit()
          $beats = @(Select-String -Path $out -Pattern '[heartbeat]' -SimpleMatch)
          if ($beats.Count -lt 2) {
            throw "window stayed alive but produced $($beats.Count) heartbeat(s) in 10s — running but not rendering"
          }
          "window rendered for 10s ($($beats.Count) heartbeats)"

      # Optional: reports in the UI but never fails the pipeline, so a moving
      # bevy integration can't block unrelated work.
      - name: Smoke-test bevy example (10s)
        continue-on-error: true
        run: |
          cargo build --release --features bevy --example bevy_app
          $p = Start-Process -FilePath "target\release\examples\bevy_app.exe" -WorkingDirectory $PWD -PassThru
          if ($p.WaitForExit(10000)) { throw "bevy_app exited early (code $($p.ExitCode))" }
          $p.Kill(); $p.WaitForExit()
          "bevy_app survived 10s"
