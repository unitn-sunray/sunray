# Defaults for the debug env vars documented in README.md ("Environment variables").
# Cargo only applies these when the variable is *not* already set (no `force = true`),
# so `SUNRAY_ENABLE_NSIGHT=1 cargo win` still wins from the shell.
[env]
# Note: this also turns validation on for release builds, where the library
# default would be off. Comment it out to get the per-profile default back.
SUNRAY_ENABLE_VALIDATION_LAYER = "1"
SUNRAY_SERIALIZE_FRAMES = "1"
# `1` dumps the per-frame render graph into <crate>/debug (git-ignored); `0` = off.
SUNRAY_GRAPH_DUMP_DIR = "0"
RUST_BACKTRACE = "1"
SUNRAY_ENABLE_GPUAV = "0"
SUNRAY_ALIAS_STRATEGY="bucket"
SUNRAY_ENABLE_NVIDIA_AFTERMATH="0"
#SUNRAY_ALIAS_STRATEGY="bucket"
# ReShade, the OBS graphics hook and the GOG Galaxy overlay inject themselves as
# implicit layers. They are the source of every `vkCmdPushDescriptorSetKHR`
# VUID-VkWriteDescriptorSet-descriptorType-00331, every
# uniformAndStorageBuffer{8,16}BitAccess VUID, and the copy-after-dispatch
# WRITE_AFTER_WRITE hazards in the log — sunray has no push-descriptor call sites and
# none of its SPIR-V declares those capabilities. With them loaded the device is lost a
# few seconds in; with this set it survives. Unset it to debug a layer interaction.
# Note: this does NOT touch the nvoglv64+0x15f9a2 access violation (docs/NVIDIA_BUG_REPORT.md),
# which reproduces identically either way.
VK_LOADER_LAYERS_DISABLE = "~implicit~"
# `-dbg` variants build the dev profile (debug assertions + symbols, slow);
# the plain ones are release. Nothing else differs.
[alias]
win      = "run --release --example window"
win-dbg  = "run --example window"
png      = "run --release --example png"
png-dbg  = "run --example png"
bevy     = "run --release --example bevy_app --features bevy"
bevy-dbg = "run --example bevy_app --features bevy"
